<svg xmlns="http://www.w3.org/2000/svg" width="620" height="950" viewBox="0 0 620 950">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#456"/></marker></defs>
<rect width="620" height="950" fill="white"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="19">
<rect x="55" y="60" width="510" height="120" rx="12" fill="#eff6ff" stroke="#64748b"/>
<text x="75" y="94" font-weight="bold">输入：商品 1 的评价 45、2、3</text>
<text x="75" y="130">评分：2、2、1；45 有两种来源</text>
<rect x="55" y="235" width="510" height="130" rx="12" fill="#ecfdf5" stroke="#64748b"/>
<text x="75" y="269" font-weight="bold">确认评价身份，按商品和评价编号去重</text>
<text x="75" y="305">商品 1 → 三条不同低分评价</text>
<text x="75" y="335">商品 2 → 单独计数，不与商品 1 相加</text>
<rect x="55" y="420" width="510" height="110" rx="12" fill="#f5f3ff" stroke="#64748b"/>
<text x="75" y="454" font-weight="bold">本轮生成一份报告</text>
<text x="75" y="490">有有效评价证据时生成，不按商品拆分</text>
<rect x="55" y="585" width="510" height="135" rx="12" fill="#fff7ed" stroke="#64748b"/>
<text x="75" y="619" font-weight="bold">逐商品比较低分条数与阈值</text>
<text x="75" y="655">2 条：warning 预警</text>
<text x="75" y="685">≥3 条：critical 预警 + 待复核</text>
<rect x="55" y="775" width="510" height="115" rx="12" fill="#f5f3ff" stroke="#64748b"/>
<text x="75" y="809" font-weight="bold">输出 pending_actions，risk_level = high</text>
<text x="75" y="845">只生成参数；不写库、不修改商品</text>
</g>
<g fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)">
<path d="M310,185 V223"/><path d="M310,370 V408"/>
<path d="M310,535 V573"/><path d="M310,725 V763"/>
</g>
</svg>
