<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#456"/></marker></defs><rect width="720" height="810" fill="white"/><rect x="35" y="35" width="650" height="140" rx="12" fill="#eff6ff" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="71" font-weight="bold">首次请求：创建 agent_runs，status = running</text><text x="60" y="110">run_id写入图状态；thread_id定位内存检查点</text></g><path d="M360,180 V207" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="220" width="650" height="140" rx="12" fill="#ecfdf5" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="256" font-weight="bold">节点包装器：为每个已执行节点追加步骤</text><text x="60" y="295">节点成功/失败分别记录，interrupt不记为错误</text><text x="60" y="325">节点耗时只计实际处理时间</text></g><path d="M360,365 V392" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="405" width="650" height="140" rx="12" fill="#fff7ed" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="441" font-weight="bold">SSE完成或失败：更新原运行状态</text><text x="60" y="480">success / error / awaiting_confirm / interrupted</text><text x="60" y="510" font-size="17">确认恢复追加步骤：成功 success / 取消 cancelled / 异常 error</text></g><path d="M360,550 V577" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="590" width="650" height="140" rx="12" fill="#f5f3ff" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="626" font-weight="bold">历史、看板、反馈：都按当前用户限制</text><text x="60" y="665">历史持久保存；检查点重启丢失时隐藏确认入口</text><text x="60" y="695">反馈修改同一条记录；成功率分母为success + error</text></g></svg>