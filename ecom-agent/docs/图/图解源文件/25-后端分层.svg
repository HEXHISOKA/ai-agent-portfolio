<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" role="img" aria-label="后端分层：api、services、agent、MCP 与底层模块之间的调用关系"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#52677d"/></marker><marker id="arrowStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3z" fill="#52677d"/></marker></defs><rect width="1120" height="900" fill="white"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><text x="560" y="38" font-size="26" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">后端分层：一次对话请求经过的目录</text><rect x="40" y="78" width="250" height="100" rx="12" fill="#edf5ff" stroke="#7fa7d4" stroke-width="1.6"/><text x="165.0" y="116.5" font-size="19" fill="#1d4f86" text-anchor="middle" dominant-baseline="central" font-weight="700">api/</text><text x="165.0" y="143.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">路由层</text><rect x="310" y="78" width="660" height="100" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="640.0" y="102.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">chat.py：/api/chat/stream、/api/chat/actions/confirm</text><text x="640.0" y="128.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">ecommerce · observability · patrol · semantic_debug · auth · user</text><text x="640.0" y="154.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">dependencies/auth.py 鉴权，schemas/ 定义入参与出参</text><rect x="40" y="238" width="250" height="100" rx="12" fill="#edf5ff" stroke="#a6bbd0" stroke-width="1.6"/><text x="165.0" y="276.5" font-size="19" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">services/</text><text x="165.0" y="303.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">业务服务层</text><rect x="310" y="238" width="660" height="100" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="640.0" y="262.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">chat_service：追问补全、调用分析图、推送 SSE、生成回答</text><text x="640.0" y="288.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">查询：query_router_service · nl2sql_service · semantic_service</text><text x="640.0" y="314.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">动作：action_decision · action_service · confirmation_service</text><rect x="40" y="398" width="250" height="100" rx="12" fill="#f2ecff" stroke="#a58bd6" stroke-width="1.6"/><text x="165.0" y="436.5" font-size="19" fill="#4b2f86" text-anchor="middle" dominant-baseline="central" font-weight="700">agent/</text><text x="165.0" y="463.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">图与节点</text><rect x="310" y="398" width="660" height="100" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="640.0" y="422.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">graph.py 建图 · state.py 共享状态 · nodes.py 节点实现</text><text x="640.0" y="448.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">scheduler / analysis_agent / decision_agent：按角色包装节点</text><text x="640.0" y="474.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">context.py 追问补全 · smalltalk.py 闲聊分流</text><rect x="40" y="558" width="250" height="80" rx="12" fill="#e6f6f2" stroke="#5fae9c" stroke-width="1.6"/><text x="165.0" y="586.5" font-size="19" fill="#145a4c" text-anchor="middle" dominant-baseline="central" font-weight="700">MCP 模块</text><text x="165.0" y="613.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">mcp_client/ → mcp_server/</text><rect x="310" y="558" width="660" height="80" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="640.0" y="585.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">client.py：以 stdio 启动 Server，调用三个工具</text><text x="640.0" y="611.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">server.py + tools_mysql / tools_chroma / tools_logs：复用查询服务</text><rect x="40" y="698" width="250" height="100" rx="12" fill="#fff6e0" stroke="#d6ab4f" stroke-width="1.6"/><text x="165.0" y="736.5" font-size="19" fill="#6b4a0e" text-anchor="middle" dominant-baseline="central" font-weight="700">底层模块</text><text x="165.0" y="763.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">数据、索引与配置</text><rect x="310" y="698" width="660" height="100" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="640.0" y="722.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">database.py：读写引擎 + 只读查询引擎 · config.py：环境配置</text><text x="640.0" y="748.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">models/：业务表、报告、预警 · observability/：运行、步骤、反馈</text><text x="640.0" y="774.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">vectorstore/ Chroma 封装 · multimodal/ 晒图描述 · utils/</text><path d="M640 178 V236" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><text x="652" y="207" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">调用服务</text><path d="M640 338 V396" fill="none" stroke="#52677d" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/><text x="652" y="367" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">调用分析图；节点也调用规则与动作服务</text><path d="M640 498 V556" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><text x="652" y="527" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">查询节点、历史节点调用 MCP 工具</text><path d="M640 638 V696" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><text x="652" y="667" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">各层按需使用</text><path d="M970 598 H1030 V288 H972" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="420" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">复用</text><text x="1040" y="442" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">查询</text><text x="1040" y="464" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">服务</text><text x="40" y="840" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">依赖方向不是单纯自上而下：MCP Server 作为独立进程，重新导入 services 中的 NL2SQL 与语义检索服务；</text><text x="40" y="866" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">节点直接调用 action_decision、action_service 等规则与动作服务，运行步骤由图包装函数写入 observability。</text></svg>