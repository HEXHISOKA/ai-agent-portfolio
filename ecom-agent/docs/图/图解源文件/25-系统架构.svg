rt" dominant-baseline="central">读写 + 只读</text><path d="M860 610 V636 H520 V680" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="623" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">只读查询、运行日志</text><path d="M980 610 V660 H715 V680" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><text x="992" y="636" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">向量检索</text><rect x="40" y="680" width="520" height="122" rx="12" fill="#fff6e0" stroke="#d6ab4f" stroke-width="1.6"/><text x="300.0" y="718.0" font-size="19" fill="#6b4a0e" text-anchor="middle" dominant-baseline="central" font-weight="700">MySQL 8</text><text x="300.0" y="744.5" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">读写连接 DATABASE_URL：页面、动作写入、运行记录</text><text x="300.0" y="767.5" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">只读连接 QUERY_DATABASE_URL：NL2SQL、语义回查、商品名</text><rect x="590" y="680" width="250" height="122" rx="12" fill="#fff6e0" stroke="#d6ab4f" stroke-width="1.6"/><text x="715.0" y="718.0" font-size="19" fill="#6b4a0e" text-anchor="middle" dominant-baseline="central" font-weight="700">Chroma</text><text x="715.0" y="744.5" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">data/chroma · ecom_texts</text><text x="715.0" y="767.5" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">商品描述、评价、晒图描述</text><rect x="870" y="680" width="210" height="122" rx="12" fill="#fff6e0" stroke="#d6ab4f" stroke-width="1.6"/><text x="975.0" y="718.0" font-size="19" fill="#6b4a0e" text-anchor="middle" dominant-baseline="central" font-weight="700">uploads/</text><text x="975.0" y="744.5" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">晒图与上传文件</text><text x="975.0" y="767.5" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">静态挂载 /uploads</text><rect x="40" y="835" width="1040" height="128" rx="16" fill="#fdeef0" stroke="#d48a96" stroke-width="1.6"/><text x="60" y="863" font-size="19" fill="#7a2a37" text-anchor="start" dominant-baseline="central" font-weight="700">模型服务（OpenAI 兼容接口）</text><rect x="60" y="880" width="320" height="66" rx="10" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="220.0" y="901.5" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">文本模型 LLM_*</text><text x="220.0" y="926.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">SQL 生成、追问改写、回答</text><rect x="400" y="880" width="320" height="66" rx="10" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="560.0" y="901.5" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">向量模型 EMBEDDING_*</text><text x="560.0" y="926.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">问题与文本向量化</text><rect x="740" y="880" width="320" height="66" rx="10" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="900.0" y="901.5" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">视觉模型 VISION_*</text><text x="900.0" y="926.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">建索引时描述晒图</text><text x="40" y="990" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">向量索引由 semantic_service.rebuild_index 离线重建：读取只读库 → 视觉模型描述晒图 → 向量化后写入 Chroma。</text><text x="40" y="1016" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">检查点保存在进程内存，服务重启后待确认任务失效；运行历史保存在 MySQL，可继续回看。</text></svg>