<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#456"/></marker></defs><rect width="720" height="810" fill="white"/><rect x="35" y="35" width="650" height="140" rx="12" fill="#eff6ff" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="71" font-weight="bold">临时核对会话：发现并调用工具</text><text x="60" y="110">list_tools 获取参数结构；call_tool 传入工具名与参数</text></g><path d="M360,180 V207" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="220" width="650" height="140" rx="12" fill="#ecfdf5" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="256" font-weight="bold">stdio → 独立 Python MCP Server 进程</text><text x="60" y="295">标准输入/输出只传协议消息；运行日志写stderr</text><text x="60" y="325">本节对话页面仍直接调用原服务</text></g><path d="M360,365 V392" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="405" width="650" height="300" rx="12" fill="#fff7ed" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="445" font-weight="bold">三个并列工具：由调用方分别选择</text><text x="60" y="490">query_mysql → SQL校验、只读连接、最多一次修复</text><text x="60" y="535">query_chroma → 向量检索和原文回查</text><text x="60" y="580">query_logs → 指定用户的运行摘要</text><text x="60" y="635" font-size="18">不读其他用户记录，不提供动作执行工具</text><text x="60" y="670" font-size="18">正常数据、业务失败、协议错误分别核对</text></g></svg>