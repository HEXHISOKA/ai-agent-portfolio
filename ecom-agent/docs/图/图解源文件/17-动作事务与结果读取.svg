<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="970" viewBox="0 0 1040 970"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#456"/></marker></defs><rect width="1040" height="970" fill="white"/><rect x="300" y="30" width="440" height="100" rx="12" fill="#eff6ff" stroke="#64748b"/><text x="318" y="63" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" fill="#172554">商品 1 的动作计划</text><text x="318" y="92" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">一份报告、一条预警、商品待复核</text><path d="M520,160 L660,220 L520,280 L380,220 Z" fill="#ecfdf5" stroke="#64748b"/><text x="444" y="225" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#172554">已批准且有动作？</text><rect x="30" y="350" width="250" height="110" rx="12" fill="#f5f3ff" stroke="#64748b"/><text x="48" y="383" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" fill="#172554">取消或没有动作</text><text x="48" y="412" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">返回空执行结果</text><text x="48" y="441" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">不写业务数据</text><rect x="350" y="350" width="440" height="110" rx="12" fill="#fff7ed" stroke="#64748b"/><text x="368" y="383" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" fill="#172554">同一会话按白名单逐条执行</text><text x="368" y="412" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">flush 可分配编号，尚未提交</text><text x="368" y="441" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">低风险报告沿用自动批准</text><path d="M520,500 L660,560 L520,620 L380,560 Z" fill="#ecfdf5" stroke="#64748b"/><text x="458" y="566" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#172554">全部动作成功？</text><rect x="30" y="680" width="250" height="110" rx="12" fill="#fef2f2" stroke="#64748b"/><text x="48" y="713" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" fill="#172554">任一动作失败</text><text x="48" y="742" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">rollback 撤回整组写入</text><text x="48" y="771" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">抛异常，不返回部分成功</text><rect x="350" y="680" width="440" height="110" rx="12" fill="#ecfdf5" stroke="#64748b"/><text x="368" y="713" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" fill="#172554">commit 统一提交</text><text x="368" y="742" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">报告、预警与待复核状态共同生效</text><text x="368" y="771" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">返回本次提交后的编号与状态</text><rect x="350" y="850" width="440" height="90" rx="12" fill="#eff6ff" stroke="#64748b"/><text x="368" y="883" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" fill="#172554">报告与预警页面</text><text x="368" y="912" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#172554">按创建用户查询，按归属标记已读</text><path d="M520,130 V148" fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)"/><path d="M380,220 H155 V338" fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)"/><text x="190" y="205" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#172554">否：取消或无动作</text><path d="M520,280 V338" fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)"/><text x="535" y="320" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#172554">是</text><path d="M520,460 V488" fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)"/><path d="M380,560 H155 V668" fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)"/><text x="285" y="545" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#172554">否</text><path d="M520,620 V668" fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)"/><text x="535" y="651" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#172554">是</text><path d="M520,790 V838" fill="none" stroke="#456" stroke-width="2" marker-end="url(#a)"/></svg>