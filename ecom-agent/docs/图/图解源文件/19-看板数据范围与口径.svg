<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="740" rx="16" fill="white"/>
<g font-family="Microsoft YaHei,sans-serif" fill="#172033">
<text x="28" y="40" font-size="25" font-weight="700">同一本人范围，不同的统计样本</text>
<rect x="160" y="70" width="960" height="118" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="640" y="104" text-anchor="middle" font-size="22" font-weight="700">AgentRun.user_id == 登录用户编号</text>
<text x="640" y="139" text-anchor="middle" font-size="19">示例：本人共有 9 次运行，管理员也限定本人数据</text>
<text x="640" y="170" text-anchor="middle" font-size="18">成功3 · 失败2 · 取消1 · 中断1 · 待确认1 · 进行中1</text>
<g fill="none" stroke="#64748b" stroke-width="2"><path d="M640 188 V219 H167 V248" marker-end="url(#a)"/><path d="M482 219 V248" marker-end="url(#a)"/><path d="M640 219 H1112 V248" marker-end="url(#a)"/><path d="M797 219 V248" marker-end="url(#a)"/></g>
<rect x="20" y="250" width="295" height="350" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
<rect x="335" y="250" width="295" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
<rect x="650" y="250" width="295" height="350" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<rect x="965" y="250" width="295" height="350" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
<text x="42" y="290" font-size="22" font-weight="700">指标卡与路由</text>
<text x="42" y="333" font-size="18">成功率：3 ÷ (3＋2) = 60%</text>
<text x="42" y="374" font-size="18">有效总耗时：1000、0、3000</text>
<text x="42" y="407" font-size="18">平均：4000 ÷ 3 ≈ 1333ms</text>
<text x="42" y="453" font-size="18">路由合计仍为全部 9 次</text>
<text x="42" y="487" font-size="18">结构化4 / 语义2 / 未判定3</text>
<text x="42" y="557" font-size="17" fill="#475569">原统计口径与原始字段保留</text>
<text x="357" y="290" font-size="22" font-weight="700">阶段耗时</text>
<text x="357" y="333" font-size="18">关联本人的运行步骤</text>
<text x="357" y="374" font-size="18">阶段示例：1000、2000、3000</text>
<text x="357" y="407" font-size="18">平均2000ms / 最大3000ms</text>
<text x="357" y="453" font-size="18">样本数 count = 3</text>
<text x="357" y="487" font-size="18">按平均值倒序取前 8 阶段</text>
<text x="357" y="557" font-size="17" fill="#475569">空耗时不算样本，0ms仍计入</text>
<text x="672" y="290" font-size="22" font-weight="700">14天运行趋势</text>
<text x="672" y="333" font-size="18">按运行创建日期计数</text>
<text x="672" y="374" font-size="18">从13天前到今天，共14点</text>
<text x="672" y="407" font-size="18">没有运行的日期补 0</text>
<text x="672" y="453" font-size="18">示例：窗口内合计 7 次</text>
<text x="672" y="487" font-size="18">另 2 次位于日期窗口外</text>
<text x="672" y="557" font-size="17" fill="#475569">卡片仍为9，曲线不强求相等</text>
<text x="987" y="290" font-size="22" font-weight="700">反馈统计</text>
<text x="987" y="333" font-size="18">本人运行 ＋ 本人提交反馈</text>
<text x="987" y="374" font-size="18">有帮助2 / 需改进1</text>
<text x="987" y="407" font-size="18">点赞率：2 ÷ 3 ≈ 66.7%</text>
<text x="987" y="453" font-size="18">未反馈的运行不进分母</text>
<text x="987" y="487" font-size="18">修改选择后按最新值统计</text>
<text x="987" y="557" font-size="17" fill="#475569">没有反馈时用None，显示 —</text>
<rect x="20" y="630" width="1240" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="640" y="672" text-anchor="middle" font-size="20">0ms 与 0% 是有效值；没有样本才显示 —；取消、中断和待确认不混入成功率与平均耗时</text>
</g></svg>