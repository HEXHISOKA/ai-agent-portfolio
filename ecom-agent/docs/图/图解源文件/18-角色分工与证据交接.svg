<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#456"/></marker></defs><rect width="720" height="810" fill="white"/><rect x="35" y="35" width="650" height="140" rx="12" fill="#eff6ff" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="71" font-weight="bold">调度：scheduler_start</text><text x="60" y="110">接收问题 → 查询分析 Agent</text></g><path d="M360,180 V207" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="220" width="650" height="140" rx="12" fill="#ecfdf5" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="256" font-weight="bold">查询分析 Agent：路由、查询、补充、合并</text><text x="60" y="295">共享 evidence、result、SQL 与截断信息</text><text x="60" y="325">复用已有节点，不为角色增加模型请求</text></g><path d="M360,365 V392" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="405" width="650" height="140" rx="12" fill="#fff7ed" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="441" font-weight="bold">调度：scheduler_handoff</text><text x="60" y="480">只交接当前状态，不重新检索证据</text></g><path d="M360,550 V577" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="590" width="650" height="140" rx="12" fill="#f5f3ff" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="626" font-weight="bold">报告决策 Agent：规划、确认、执行</text><text x="60" y="665">使用同一份 evidence 生成动作计划</text><text x="60" y="695">确认节点标识不变，继续恢复原线程</text></g></svg>