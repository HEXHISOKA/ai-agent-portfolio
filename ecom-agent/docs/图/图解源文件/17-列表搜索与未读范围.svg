<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="640" rx="18" fill="#fff"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#172033">
<text x="36" y="40" font-size="24" font-weight="700">列表搜索、未读统计与批量已读，使用不同的数据范围</text>
<rect x="310" y="65" width="500" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="560" y="103" text-anchor="middle" font-size="22" font-weight="700">共同条件：created_by == user_id</text>
<text x="560" y="135" text-anchor="middle" font-size="18" fill="#475569">用户编号来自登录认证；管理员也只处理本人记录</text>
<g fill="none" stroke="#64748b" stroke-width="2"><path d="M560 155 V185 H190 V218" marker-end="url(#arrow)"/><path d="M560 155 V218" marker-end="url(#arrow)"/><path d="M560 185 H930 V218" marker-end="url(#arrow)"/></g>
<rect x="25" y="220" width="330" height="300" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
<rect x="395" y="220" width="330" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
<rect x="765" y="220" width="330" height="300" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="50" y="260" font-size="23" font-weight="700">列表查询</text>
<text x="50" y="304" font-size="20">本人记录 ＋ 关键词匹配</text>
<text x="50" y="340" font-size="18">报告：问题 / 摘要 / 商品名</text>
<text x="50" y="373" font-size="18">预警：标题 / 内容 / 商品名</text>
<text x="50" y="422" font-size="20">示例：搜索匹配 2 条</text>
<text x="50" y="459" font-size="20">返回分页行和 total = 2</text>
<text x="50" y="493" font-size="18" fill="#475569">只影响列表及其总数</text>
<text x="420" y="260" font-size="23" font-weight="700">未读汇总</text>
<text x="420" y="304" font-size="20">本人全部预警</text>
<text x="420" y="340" font-size="18">不带搜索词或页码</text>
<text x="420" y="390" font-size="20">示例：共有 12 条</text>
<text x="420" y="426" font-size="20">total = 12，unread = 7</text>
<text x="420" y="493" font-size="18" fill="#475569">角标与列表筛选无关</text>
<text x="790" y="260" font-size="23" font-weight="700">全部标记已读</text>
<text x="790" y="304" font-size="20">本人 ＋ is_read = 0</text>
<text x="790" y="340" font-size="18">不使用当前页的通知编号</text>
<text x="790" y="390" font-size="20">示例：更新全部 7 条未读</text>
<text x="790" y="426" font-size="20">返回 updated = 7</text>
<text x="790" y="493" font-size="18" fill="#475569">不修改其他用户的通知</text>
<rect x="25" y="548" width="1070" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="560" y="586" text-anchor="middle" font-size="20">批量成功后：重新读取当前列表与未读统计；没有新增未读时，unread = 0</text>
</g></svg>