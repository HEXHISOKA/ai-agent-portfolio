<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#456"/></marker></defs>
<rect width="720" height="930" fill="white"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#172554">
<rect x="35" y="35" width="650" height="125" rx="12" fill="#eff6ff" stroke="#64748b"/>
<text x="60" y="74" font-size="20" font-weight="bold">首次请求：生成同一份证据与动作计划</text>
<text x="60" y="116" font-size="19">服务端生成 thread_id，把 user_id 写入图状态</text>
<rect x="35" y="215" width="650" height="155" rx="12" fill="#ecfdf5" stroke="#64748b"/>
<text x="60" y="253" font-size="20" font-weight="bold">confirm_gate：按风险决定是否暂停</text>
<text x="60" y="292" font-size="19">高风险：interrupt 保存检查点，等待用户选择</text>
<text x="60" y="325" font-size="19">图暂停后，对话服务仍完成 SSE 回答并返回计划</text>
<text x="60" y="354" font-size="18">低风险不暂停，直接结束图</text>
<text x="282" y="412" font-size="18">仅高风险</text>
<text x="620" y="412" font-size="18">低风险</text>
<rect x="35" y="450" width="455" height="150" rx="12" fill="#fff7ed" stroke="#64748b"/>
<text x="60" y="485" font-size="20" font-weight="bold">用户确认或取消</text>
<text x="60" y="519" font-size="18">POST /api/chat/actions/confirm</text>
<text x="60" y="550" font-size="18">同一把锁内检查待确认状态与用户归属</text>
<text x="60" y="581" font-size="18">提交 thread_id 与 approved（true / false）</text>
<rect x="525" y="450" width="160" height="150" rx="12" fill="#f5f3ff" stroke="#64748b"/>
<text x="545" y="485" font-size="20" font-weight="bold">低风险结束</text>
<text x="545" y="522" font-size="17">直接到 END</text>
<text x="545" y="552" font-size="17">无确认按钮</text>
<text x="545" y="582" font-size="17">不调用确认接口</text>
<rect x="35" y="675" width="455" height="190" rx="12" fill="#f5f3ff" stroke="#64748b"/>
<text x="60" y="713" font-size="20" font-weight="bold">Command(resume=...)</text>
<text x="60" y="748" font-size="18">原节点重跑，interrupt 返回选择</text>
<text x="60" y="780" font-size="18">确认 → human_approved = True</text>
<text x="60" y="812" font-size="18">取消 → human_approved = False</text>
<text x="60" y="844" font-size="18">返回后到 END；本节不写业务数据</text>
<text x="35" y="903" font-size="18">重复确认返回 409；服务重启使内存检查点失效</text>
</g>
<g fill="none" stroke="#456" stroke-width="2" marker-end="url(#arrow)">
<path d="M360,165 V203"/>
<path d="M265,375 V438"/>
<path d="M605,375 V438"/>
<path d="M265,605 V663"/>
</g>
</svg>
