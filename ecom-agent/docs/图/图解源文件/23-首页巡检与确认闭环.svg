<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="1200" height="1260" fill="white"/><g font-family="Microsoft YaHei,sans-serif" fill="#172554"><rect x="30" y="20" width="1140" height="90" rx="12" fill="#eff6ff" stroke="#64748b"/><text x="48" y="50" font-size="21" font-weight="bold">首页概览：独立的固定SQL统计</text><text x="48" y="82" font-size="18">订单量覆盖各状态，金额排除取消订单；报告和预警按当前用户筛选</text><rect x="400" y="145" width="400" height="65" rx="12" fill="#eff6ff" stroke="#64748b"/><text x="418" y="175" font-size="21" font-weight="bold">点击“一键巡检”</text><path d="M600 210 V228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><polygon points="600,235 770,290 600,345 430,290" fill="#ecfdf5" stroke="#64748b"/><text x="493" y="296" font-size="20">有可恢复的本人计划？</text><path d="M430 290 H180 V378" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="240" y="280" font-size="18">有</text><path d="M600 345 V378" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="620" y="370" font-size="18">无</text><rect x="30" y="390" width="300" height="150" rx="12" fill="#f5f3ff" stroke="#64748b"/><text x="48" y="420" font-size="21" font-weight="bold">复用原运行，返回首页</text><text x="48" y="452" font-size="18">原run_id、计划、错误不变</text><text x="48" y="479" font-size="18">只展示原回答摘要</text><text x="48" y="506" font-size="18">不重新调用模型</text><text x="48" y="533" font-size="18">点击“查看本次运行”</text><rect x="420" y="390" width="430" height="120" rx="12" fill="#fff7ed" stroke="#64748b"/><text x="438" y="420" font-size="21" font-weight="bold">新建运行，复用原分析图</text><text x="438" y="452" font-size="18">MCP查询 → 证据 → 动作计划</text><text x="438" y="479" font-size="18">高风险仍停在确认节点</text><path d="M635 510 V543" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="555" width="430" height="90" rx="12" fill="#fff7ed" stroke="#64748b"/><text x="438" y="585" font-size="21" font-weight="bold">接收流式结果并返回首页</text><text x="438" y="617" font-size="18">done仍检查query_failed，失败关联原运行</text><path d="M635 645 V690 H180 V765" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="35" y="747" font-size="18">无需人工确认</text><path d="M635 645 V765" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="650" y="747" font-size="18">计划待确认</text><path d="M635 645 V690 H1035 V765" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="1050" y="747" font-size="18">失败</text><rect x="30" y="780" width="300" height="130" rx="12" fill="#ecfdf5" stroke="#64748b"/><text x="48" y="810" font-size="21" font-weight="bold">显示实际结果后结束</text><text x="48" y="842" font-size="18">低风险沿用自动批准</text><text x="48" y="869" font-size="18">无动作时不写业务数据</text><rect x="420" y="780" width="430" height="130" rx="12" fill="#f5f3ff" stroke="#64748b"/><text x="438" y="810" font-size="21" font-weight="bold">展示待确认计划</text><text x="438" y="842" font-size="18">首页不绕过人工确认</text><text x="438" y="869" font-size="18">点击“查看本次运行”</text><rect x="900" y="780" width="270" height="130" rx="12" fill="#fef2f2" stroke="#64748b"/><text x="918" y="810" font-size="21" font-weight="bold">显示错误后结束</text><text x="918" y="842" font-size="18">保留错误与已有run_id</text><text x="918" y="869" font-size="18">部分回答不当成功</text><path d="M635 910 V978" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M30 465 H10 V1035 H408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="990" width="430" height="90" rx="12" fill="#eff6ff" stroke="#64748b"/><text x="438" y="1020" font-size="21" font-weight="bold">历史详情：核对风险与逐项动作</text><text x="438" y="1052" font-size="18">检查点及用户归属通过后提交选择</text><path d="M635 1080 V1110 H450 V1148" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="360" y="1137" font-size="18">确认</text><path d="M635 1080 V1110 H865 V1148" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="880" y="1137" font-size="18">取消</text><rect x="270" y="1160" width="360" height="85" rx="12" fill="#ecfdf5" stroke="#64748b"/><text x="288" y="1190" font-size="21" font-weight="bold">执行白名单动作</text><text x="288" y="1222" font-size="18">整组提交；失败整组回滚</text><rect x="700" y="1160" width="330" height="85" rx="12" fill="#f5f3ff" stroke="#64748b"/><text x="718" y="1190" font-size="21" font-weight="bold">跳过整组动作</text><text x="718" y="1222" font-size="18">不写报告、预警或复核状态</text></g></svg>