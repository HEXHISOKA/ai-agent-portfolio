<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="1100" height="930" fill="white"/><g font-family="Microsoft YaHei,sans-serif" fill="#172554"><rect x="300" y="25" width="500" height="110" rx="12" fill="#eff6ff" stroke="#64748b"/><text x="322" y="59" font-size="23" font-weight="bold">图节点 → MCP Client</text><text x="322" y="93" font-size="19">问题、kind、目标商品沿用原参数</text><text x="322" y="123" font-size="19">日志用户编号来自认证状态</text><path d="M550 135 V165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="175" width="500" height="110" rx="12" fill="#ecfdf5" stroke="#64748b"/><text x="322" y="209" font-size="23" font-weight="bold">启动、握手、调用</text><text x="322" y="243" font-size="19">当前解释器和固定工作目录</text><text x="322" y="273" font-size="19">stdio_client → session → call_tool</text><path d="M550 285 V315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="325" width="500" height="110" rx="12" fill="#fff7ed" stroke="#64748b"/><text x="322" y="359" font-size="23" font-weight="bold">先检查并解析结果</text><text x="322" y="393" font-size="19">检查 isError，再解析业务对象</text><text x="322" y="423" font-size="19">解析发生在异步上下文内部</text><path d="M550 435 V465" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="475" width="500" height="100" rx="12" fill="#f5f3ff" stroke="#64748b"/><text x="322" y="509" font-size="23" font-weight="bold">再退出上下文，释放资源</text><text x="322" y="543" font-size="19">成功、解析错误或超时都经过清理</text><path d="M550 575 V610 H185 V655" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M550 575 V655" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M550 575 V610 H915 V655" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="90" y="642" font-size="19">正常结果</text><text x="425" y="642" font-size="19">SQL业务失败</text><text x="820" y="642" font-size="19">其他错误</text><rect x="20" y="670" width="330" height="200" rx="12" fill="#ecfdf5" stroke="#64748b"/><text x="42" y="704" font-size="23" font-weight="bold">沿用节点的数据契约</text><text x="42" y="738" font-size="19">SQL / rows / truncated</text><text x="42" y="768" font-size="19">继续合并证据与规划动作</text><text x="42" y="798" font-size="19">历史摘要只存 recent_logs</text><text x="42" y="828" font-size="19">不加入证据或低分计数</text><rect x="385" y="670" width="330" height="200" rx="12" fill="#fff7ed" stroke="#64748b"/><text x="407" y="704" font-size="23" font-weight="bold">恢复原有异常类型</text><text x="407" y="738" font-size="19">QueryExecutionError</text><text x="407" y="768" font-size="19">进入既有查询失败分支</text><text x="407" y="798" font-size="19">统计不可用时明确说明</text><text x="407" y="828" font-size="19">不编造数量或生成动作</text><rect x="750" y="670" width="330" height="200" rx="12" fill="#fef2f2" stroke="#64748b"/><text x="772" y="704" font-size="23" font-weight="bold">异常向上传递</text><text x="772" y="738" font-size="19">参数、配置、进程或超时</text><text x="772" y="768" font-size="19">对话服务发送 error 收尾</text><text x="772" y="798" font-size="19">不发送成功 done</text><text x="772" y="828" font-size="19">不继续回答或规划</text></g></svg>