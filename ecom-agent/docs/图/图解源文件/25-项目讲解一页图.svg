<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 905" role="img" aria-label="项目讲解一页图：业务问题、三个难点、对应方案与可展示的结果"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#52677d"/></marker><marker id="arrowStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3z" fill="#52677d"/></marker></defs><rect width="1120" height="905" fill="white"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><text x="560" y="38" font-size="26" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">项目讲解一页图：问题 → 难点 → 方案 → 结果</text><rect x="40" y="68" width="1040" height="78" rx="12" fill="#edf5ff" stroke="#7fa7d4" stroke-width="1.6"/><text x="560.0" y="95.5" font-size="19" fill="#1d4f86" text-anchor="middle" dominant-baseline="central" font-weight="700">业务问题</text><text x="560.0" y="122.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">用自然语言查询商品、订单和评价，发现差评问题，经人工确认后生成报告、预警和复核标记</text><text x="145.0" y="180" font-size="19" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">难点</text><text x="540.0" y="180" font-size="19" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">方案（代码中的做法）</text><text x="955.0" y="180" font-size="19" fill="#182b41" text-anchor="middle" dominant-baseline="central" font-weight="700">可展示的结果</text><rect x="40" y="205" width="210" height="170" rx="12" fill="#f2ecff" stroke="#a58bd6" stroke-width="1.6"/><text x="145.0" y="278.5" font-size="19" fill="#4b2f86" text-anchor="middle" dominant-baseline="central" font-weight="700">查询怎么选</text><text x="145.0" y="305.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">统计要准，措辞多变</text><path d="M250 290.0 H288" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="205" width="500" height="170" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="540.0" y="251.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">规则路由：编号、统计、商品名走 SQL，其余走语义</text><text x="540.0" y="277.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">NL2SQL 用只读连接，白名单三张表，只允许 SELECT</text><text x="540.0" y="303.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">默认返回 20 行、最多 200 行，超时 5 秒</text><text x="540.0" y="329.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">执行出错修复一次，仍失败就说明无法统计</text><path d="M790 290.0 H828" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="205" width="250" height="170" rx="12" fill="#e6f6f2" stroke="#5fae9c" stroke-width="1.6"/><text x="955.0" y="264.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">对话过程区显示</text><text x="955.0" y="290.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">路由理由与实际 SQL</text><text x="955.0" y="316.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">统计失败时如实说明</text><rect x="40" y="395" width="210" height="170" rx="12" fill="#f2ecff" stroke="#a58bd6" stroke-width="1.6"/><text x="145.0" y="468.5" font-size="19" fill="#4b2f86" text-anchor="middle" dominant-baseline="central" font-weight="700">证据可不可信</text><text x="145.0" y="495.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">候选可能不相关或过期</text><path d="M250 480.0 H288" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="395" width="500" height="170" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="540.0" y="441.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">同一商品低分评价 ≥ 2 条才定向补充检索</text><text x="540.0" y="467.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">相似度低于 0.35 的候选过滤，回查 MySQL 核对商品</text><text x="540.0" y="493.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">按评价编号去重，合并 SQL 与语义两种来源</text><text x="540.0" y="519.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">晒图描述核对原图哈希后才作为证据</text><path d="M790 480.0 H828" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="395" width="250" height="170" rx="12" fill="#e6f6f2" stroke="#5fae9c" stroke-width="1.6"/><text x="955.0" y="454.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">回答附证据表格与来源</text><text x="955.0" y="480.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">语义检索调试页</text><text x="955.0" y="506.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">查看命中片段与相似度</text><rect x="40" y="585" width="210" height="170" rx="12" fill="#f2ecff" stroke="#a58bd6" stroke-width="1.6"/><text x="145.0" y="658.5" font-size="19" fill="#4b2f86" text-anchor="middle" dominant-baseline="central" font-weight="700">写操作怎么控</text><text x="145.0" y="685.0" font-size="15" fill="#53677f" text-anchor="middle" dominant-baseline="central">Agent 不能随意改数据</text><path d="M250 670.0 H288" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="585" width="500" height="170" rx="12" fill="#ffffff" stroke="#a6bbd0" stroke-width="1.6"/><text x="540.0" y="631.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">只允许报告、预警、待复核三类动作，同一事务提交</text><text x="540.0" y="657.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">含预警或复核时用 interrupt 暂停，等待确认</text><text x="540.0" y="683.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">只有本人能确认，加锁防重复，取消则整组跳过</text><text x="540.0" y="709.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">价格、库存、上下架和订单状态保持只读</text><path d="M790 670.0 H828" fill="none" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="585" width="250" height="170" rx="12" fill="#e6f6f2" stroke="#5fae9c" stroke-width="1.6"/><text x="955.0" y="644.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">诊断报告与未读预警</text><text x="955.0" y="670.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">运行历史回看</text><text x="955.0" y="696.0" font-size="17" fill="#182b41" text-anchor="middle" dominant-baseline="central">每一步结果与耗时</text><rect x="40" y="790" width="1040" height="58" rx="10" fill="#fff6e0" stroke="#d6ab4f" stroke-width="1.6"/><text x="560.0" y="819.0" font-size="17" fill="#6b4a0e" text-anchor="middle" dominant-baseline="central" font-weight="700">FastAPI · LangGraph · MCP（stdio）· MySQL · Chroma · SSE · Vue 3</text><text x="40" y="880" font-size="15" fill="#53677f" text-anchor="start" dominant-baseline="central">讲述顺序：先说业务问题，再按三个难点各讲一个设计取舍，最后打开对应页面演示结果。</text></svg>