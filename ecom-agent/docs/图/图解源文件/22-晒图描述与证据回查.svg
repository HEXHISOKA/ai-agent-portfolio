<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#456"/></marker></defs><rect width="720" height="810" fill="white"/><rect x="35" y="35" width="650" height="140" rx="12" fill="#eff6ff" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="71" font-weight="bold">构建索引：读取评价文字和img路径</text><text x="60" y="110">仅加载/uploads内的图片；不修改评价原文</text></g><path d="M360,180 V207" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="220" width="650" height="140" rx="12" fill="#ecfdf5" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="256" font-weight="bold">视觉模型 → 图片描述（独立配置）</text><text x="60" y="295">缓存键：图片字节摘要 + 地址 + 模型 + 提示</text><text x="60" y="325">描述失败：该评价继续使用文字</text></g><path d="M360,365 V392" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="405" width="650" height="140" rx="12" fill="#fff7ed" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="441" font-weight="bold">文字 + 晒图描述 → embedding → Chroma</text><text x="60" y="480">仍使用review:评价编号，不新增另一条评价</text><text x="60" y="510">向量全部成功后才替换旧集合</text></g><path d="M360,550 V577" stroke="#456" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="590" width="650" height="140" rx="12" fill="#f5f3ff" stroke="#64748b"/><g font-family="Microsoft YaHei, sans-serif" fill="#172554" font-size="20"><text x="60" y="626" font-weight="bold">检索命中 → 回查MySQL → 核对原图摘要</text><text x="60" y="665">图片已变化或删除：不引用旧描述</text><text x="60" y="695">回答标明晒图来源，不把可见缺陷推断为原因</text></g></svg>