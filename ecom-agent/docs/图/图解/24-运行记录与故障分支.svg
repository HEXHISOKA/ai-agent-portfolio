<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 780" role="img" aria-label="一次分析的记录关联与四种结束方式"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52677d"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182b41;font-size:18px} .edge{fill:none;stroke:#52677d;stroke-width:2;marker-end:url(#arrow)} .note{font-size:16px;fill:#53677f} .title{font-size:23px;font-weight:700}</style><text class="title" x="615.0" y="34" text-anchor="middle">一次分析的记录关联与四种结束方式</text><rect x="30" y="70" width="270" height="80" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="165.0" y="116.0" text-anchor="middle">提问与已完成业务历史</text><path class="edge" d="M300 110 H370"/><rect x="370" y="70" width="290" height="80" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="515.0" y="116.0" text-anchor="middle">入口判断：引导还是业务？</text><path class="edge" d="M660 110 H730"/><text class="note" x="695" y="94" text-anchor="middle">业务</text><rect x="730" y="70" width="430" height="80" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="945.0" y="102.0" text-anchor="middle">建立 run_id 与 thread_id</text><text x="945.0" y="130.0" text-anchor="middle">查询 → 证据 → 动作计划</text><path class="edge" d="M440 150 V250 H340"/><text class="note" x="550" y="205" text-anchor="middle">寒暄／信息不足</text><rect x="30" y="215" width="310" height="100" rx="12" fill="#f0f6fb" stroke="#a6bbd0"/><text x="185.0" y="257.0" text-anchor="middle">引导结束</text><text x="185.0" y="285.0" text-anchor="middle">不建运行、不进入业务历史</text><path class="edge" d="M945 150 V215"/><rect x="730" y="215" width="430" height="100" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="945.0" y="257.0" text-anchor="middle">实际 SQL、步骤、回答与反馈</text><text x="945.0" y="285.0" text-anchor="middle">均关联本次 run_id</text><path class="edge" d="M945 315 V390 H165 V460"/><path class="edge" d="M945 390 H465 V460"/><path class="edge" d="M945 390 H765 V460"/><path class="edge" d="M945 390 H1065 V460"/><rect x="30" y="460" width="270" height="180" rx="12" fill="#ecf9f1" stroke="#a6bbd0"/><text x="165.0" y="510.0" text-anchor="middle">收到 done，回答已结束</text><text class="note" x="165.0" y="538.0" text-anchor="middle">查询成功：success／待确认</text><text class="note" x="165.0" y="566.0" text-anchor="middle">query_failed=true：error</text><text x="165.0" y="594.0" text-anchor="middle">反馈绑定本次运行</text><rect x="330" y="460" width="270" height="180" rx="12" fill="#f0f6fb" stroke="#a6bbd0"/><text x="465.0" y="528.0" text-anchor="middle">主动停止／离页</text><text x="465.0" y="556.0" text-anchor="middle">取消本轮接收</text><text x="465.0" y="584.0" text-anchor="middle">不等于撤销服务端动作</text><rect x="630" y="460" width="270" height="180" rx="12" fill="#fff7e7" stroke="#a6bbd0"/><text x="765.0" y="528.0" text-anchor="middle">第一段正文后提前结束</text><text x="765.0" y="556.0" text-anchor="middle">缺少终止事件 → 失败</text><text x="765.0" y="584.0" text-anchor="middle">手动重试会创建新运行</text><rect x="930" y="460" width="270" height="180" rx="12" fill="#fff0ef" stroke="#a6bbd0"/><text x="1065.0" y="528.0" text-anchor="middle">回答失败收到 error</text><text x="1065.0" y="556.0" text-anchor="middle">返回原待确认计划</text><text x="1065.0" y="584.0" text-anchor="middle">确认／取消处理原运行</text><text class="note" x="600" y="705" text-anchor="middle">只有返回原 confirmation 的失败才能继续处理原计划；提前断流不是会话恢复。</text><text class="note" x="600" y="740" text-anchor="middle">run_id 定位数据库记录，thread_id 定位内存检查点，user_id 校验归属。</text></svg>