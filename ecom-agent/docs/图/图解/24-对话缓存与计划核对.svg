<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" role="img" aria-label="对话缓存恢复与后端计划核对"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#52677d"/></marker></defs><rect width="1120" height="860" fill="white"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182b41;font-size:19px}.small{font-size:16px;fill:#53677f}.title{font-size:25px;font-weight:700}.edge{stroke:#52677d;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="560" y="38" text-anchor="middle" class="title">恢复对话画面，不恢复旧流或动作执行权限</text><rect x="50" y="85" width="450" height="115" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="275.0" y="133.5" text-anchor="middle" class="">消息／SQL／表格／运行编号／草稿</text><text x="275.0" y="165.5" text-anchor="middle" class="">300毫秒合并保存，离页前立即保存</text><rect x="620" y="85" width="450" height="115" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="845.0" y="133.5" text-anchor="middle" class="">sessionStorage：按当前账号分键</text><text x="845.0" y="165.5" text-anchor="middle" class="">当前标签页内保留，退出清理</text><path d="M500 142 H620" class="edge"/><text x="560" y="123" text-anchor="middle" class="small">JSON</text><path d="M845 200 V275" class="edge"/><text x="845" y="243" text-anchor="middle" class="small">切页返回或刷新</text><rect x="620" y="275" width="450" height="110" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="845.0" y="321.0" text-anchor="middle" class="">校验版本、账号、有效期和字段</text><text x="845.0" y="353.0" text-anchor="middle" class="">还原消息与草稿，旧加载态清零</text><path d="M620 330 H500" class="edge"/><text x="560" y="313" text-anchor="middle" class="small">解析</text><rect x="50" y="275" width="450" height="110" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="275.0" y="321.0" text-anchor="middle" class="">先显示原回答与查询结果</text><text x="275.0" y="353.0" text-anchor="middle" class="">原确认入口关闭，反馈等待核对</text><path d="M275 385 V465" class="edge"/><text x="275" y="429" text-anchor="middle" class="small">按原run_id读取本人运行</text><rect x="50" y="465" width="450" height="115" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="275.0" y="513.5" text-anchor="middle" class="">后端返回最新反馈与待确认检查点</text><text x="275.0" y="545.5" text-anchor="middle" class="">不重新提问，不新增运行记录</text><path d="M500 500 H620" class="edge"/><text x="560" y="482" text-anchor="middle" class="small">仍可确认</text><rect x="620" y="455" width="450" height="100" rx="12" fill="#ecf9f1" stroke="#a6bbd0"/><text x="845.0" y="496.0" text-anchor="middle" class="">更新反馈，显示原计划确认入口</text><text x="845.0" y="528.0" text-anchor="middle" class="">确认时仍由后端校验归属与状态</text><path d="M500 550 H560 V650 H620" class="edge"/><text x="710" y="608" text-anchor="middle" class="small">已处理／已取消／重启失效／读取失败</text><rect x="620" y="630" width="450" height="100" rx="12" fill="#fff6e8" stroke="#a6bbd0"/><text x="845.0" y="671.0" text-anchor="middle" class="">保留已有回答，关闭旧确认入口</text><text x="845.0" y="703.0" text-anchor="middle" class="">提示原因，可到运行历史核对</text><text x="560" y="785" text-anchor="middle" class="small">未完成的旧流只恢复为“已停止”，不会自动续接SSE或重建检查点。</text><text x="560" y="820" text-anchor="middle" class="small">最近20轮 · 约2MB上限 · 最后保存后24小时过期 · 新对话清空当前账号对话</text></svg>