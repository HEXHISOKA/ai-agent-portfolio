<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-label="新旧密码格式怎样共用登录入口"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52677d"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182b41;font-size:18px} .edge{fill:none;stroke:#52677d;stroke-width:2;marker-end:url(#arrow)} .note{font-size:16px;fill:#53677f} .title{font-size:23px;font-weight:700}</style><text class="title" x="560.0" y="34" text-anchor="middle">新旧密码格式怎样共用登录入口</text><rect x="360" y="70" width="400" height="70" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="560.0" y="111.0" text-anchor="middle">登录输入的密码＋数据库保存的哈希</text><path class="edge" d="M560 140 V180"/><rect x="360" y="180" width="400" height="70" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="560.0" y="221.0" text-anchor="middle">保存的哈希是否带新格式标记？</text><path class="edge" d="M360 215 H270 V320"/><path class="edge" d="M760 215 H850 V320"/><text class="note" x="250" y="285" text-anchor="end">无标记：历史 bcrypt</text><text class="note" x="870" y="285" text-anchor="start">有标记：bcrypt-sha256-v1</text><rect x="50" y="320" width="440" height="150" rx="12" fill="#f0f6fb" stroke="#a6bbd0"/><text x="270.0" y="373.0" text-anchor="middle">按原密码的 UTF-8 字节验证</text><text x="270.0" y="401.0" text-anchor="middle">不套用新密码长度规则</text><text x="270.0" y="429.0" text-anchor="middle">历史 123 仍可验证</text><rect x="630" y="320" width="440" height="150" rx="12" fill="#ecf9f1" stroke="#a6bbd0"/><text x="850.0" y="373.0" text-anchor="middle">完整 UTF-8 → SHA-256</text><text x="850.0" y="401.0" text-anchor="middle">Base64 编码为 44 个字节</text><text x="850.0" y="429.0" text-anchor="middle">再按保存的 bcrypt 哈希验证</text><path class="edge" d="M270 470 V530 H420"/><path class="edge" d="M850 470 V530 H700"/><rect x="420" y="495" width="280" height="80" rx="12" fill="#edf5ff" stroke="#a6bbd0"/><text x="560.0" y="527.0" text-anchor="middle">匹配：允许登录</text><text x="560.0" y="555.0" text-anchor="middle">不匹配：密码错误</text><text class="note" x="560" y="630" text-anchor="middle">设置新密码时先校验 6～64 个字符，再生成带标记的新哈希。</text><text class="note" x="560" y="665" text-anchor="middle">不截断密码，不重置旧账号；登录按保存的格式选择验证分支。</text></svg>