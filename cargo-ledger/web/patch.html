<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>补充快递单号</title>
<style>
  :root{
    --bg:#f6f7f8; --card:#fff; --ink:#15181c; --sub:#66707c; --line:#e3e6ea;
    --accent:#0b7a75; --accent-soft:#e6f4f3; --ok:#05603a; --ok-soft:#e8f6ee;
    --warn:#8a5a00; --warn-soft:#fff8e6; --err:#b42318; --err-soft:#fdecea;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  main{max-width:560px; margin:0 auto; padding:24px 16px 60px}
  h1{font-size:22px; margin:0 0 6px; letter-spacing:-.01em}
  header.hero{margin-bottom:18px}
  .lead{margin:0; color:var(--sub); font-size:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
  label{display:block; font-size:13px; font-weight:600; color:var(--sub); margin-bottom:8px}
  .row{display:flex; gap:8px}
  input[type=text]{
    flex:1; min-width:0; font:inherit; font-size:17px; padding:12px 14px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(11,122,117,.12)}
  #tail{letter-spacing:.28em; font-weight:600}
  button{
    font:inherit; font-weight:600; padding:12px 20px; border-radius:10px; cursor:pointer;
    border:1px solid transparent; background:var(--accent); color:#fff; white-space:nowrap;
    transition:opacity .15s;
  }
  button:active{opacity:.82}
  button:disabled{opacity:.5; cursor:not-allowed}
  button.ghost{background:#fff; color:var(--accent); border-color:var(--accent)}
  .hint{font-size:12.5px; color:var(--sub); margin-top:8px}
  .note{border-radius:10px; padding:11px 13px; font-size:13.5px; margin-bottom:14px}
  .note.ok{background:var(--ok-soft); color:var(--ok)}
  .note.warn{background:var(--warn-soft); color:var(--warn)}
  .note.err{background:var(--err-soft); color:var(--err)}
  .note.info{background:var(--accent-soft); color:#075e5a}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .item.done{background:var(--ok-soft); border-color:#bfe5cd}
  .item .head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px}
  .item .prod{font-weight:600; font-size:15.5px; word-break:break-all}
  .item .meta{font-size:12.5px; color:var(--sub); white-space:nowrap}
  .item .fill{display:flex; gap:8px}
  .item.done .fill{display:none}
  .item .sent{display:none; font-size:13.5px; color:var(--ok); font-weight:600}
  .item.done .sent{display:block}
  footer{margin-top:26px; font-size:12px; color:var(--sub); text-align:center; line-height:1.9}
  .spin{
    display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px;
    border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>补充快递单号</h1>
    <p class="lead">下单时还没出运单号，拿到货后把单号填在这里就行，运营核对后进台账。</p>
  </header>

  <div class="card">
    <label for="tail">收货人手机号后 4 位</label>
    <div class="row">
      <input id="tail" type="text" inputmode="numeric" maxlength="4" placeholder="例如 2654"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="btn" onclick="lookup()">查询</button>
    </div>
    <div class="hint" id="tailHint">填满 4 位会自动查询。只认收件人号码，下单人的不算。</div>
  </div>

  <div id="out"></div>

  <footer>
    只展示还缺快递单号的订单，已登记的不会重复出现。<br>
    查不到请核对尾号，或直接联系运营。
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function note(kind, text){
  return '<div class="note ' + kind + '">' + esc(text) + '</div>';
}

function fmtDate(s){
  // 表格里的时间可能是 "2026-10-29 12:00:00" 或 "2026/10/29"，只取日期
  const raw = String(s || '').trim();
  // 兜底：接口万一给的是时间戳（10 位秒 / 13 位毫秒），别让整列显示"日期未填"。
  // 服务端已经转成日期字符串了，这里只是防止格式一变就全空。
  if(/^\d{10}$/.test(raw) || /^\d{13}$/.test(raw)){
    const d = new Date(raw.length === 13 ? +raw : +raw * 1000);
    if(!isNaN(d.getTime())){
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
             + '-' + String(d.getDate()).padStart(2,'0');
    }
  }
  const m = raw.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(!m) return '日期未填';
  return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
}

/* 线上这个域名不带 sharecode 访问任何路径都会被托管层挡成「链接不完整」。
   浏览器带着 sharecode 访问过页面后，同源请求通常会自动放行（cookie），
   但隐私模式 / 禁用 cookie 时不会——所以这里再显式拼一次，双保险。
   拿不到 sharecode 就原样发：本地开发时本来就没有这个参数。 */
const SC = new URLSearchParams(location.search).get('sharecode') || '';

function withSc(path){
  if(!SC) return path;
  return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'sharecode=' + encodeURIComponent(SC);
}

async function post(path, body){
  const r = await fetch(withSc(path), {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  let d;
  try{ d = await r.json(); }
  catch(e){ throw new Error('网络不通，稍后再试'); }
  if(!r.ok && d && d.error) throw new Error(d.error);
  return d;
}

let TAIL = '';
let TIMER = null;

async function lookup(){
  const tail = ($('tail').value || '').trim();
  if(!/^\d{4}$/.test(tail)){
    $('out').innerHTML = note('warn', '请输入手机号后 4 位数字');
    return;
  }
  TAIL = tail;
  const btn = $('btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  $('out').innerHTML = '';
  try{
    const d = await post('/api/pub/lookup', {tail});
    render(d);
  }catch(e){
    $('out').innerHTML = note('err', e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = '查询';
  }
}

function render(d){
  if(!d.items || !d.items.length){
    $('out').innerHTML = note('info', d.tip);
    return;
  }
  let html = note('info', d.tip);
  d.items.forEach(function(it, i){
    const meta = [fmtDate(it.date), (it.qty || 1) + ' 件'].join(' · ');
    html += '<div class="item" data-hid="' + esc(it.hid) + '">'
      +   '<div class="head">'
      +     '<span class="prod">' + esc(it.product || '（未填商品）') + '</span>'
      +     '<span class="meta">' + esc(meta) + '</span>'
      +   '</div>'
      +   '<div class="fill">'
      +     '<input type="text" data-no placeholder="填快递单号" autocomplete="off" spellcheck="false">'
      +     '<button onclick="submitOne(this)">提交</button>'
      +   '</div>'
      +   '<div class="sent">已提交，等运营核对</div>'
      + '</div>';
  });
  $('out').innerHTML = html;
  const first = $('out').querySelector('input[data-no]');
  if(first) first.focus();
}

async function submitOne(btn){
  const box = btn.closest('.item');
  const inp = box.querySelector('input[data-no]');
  const no = (inp.value || '').trim();
  if(!no){
    inp.focus();
    return;
  }
  if(!/^[0-9A-Za-z\-]{8,24}$/.test(no.replace(/\s/g, ''))){
    flash(box, '单号看着不对，通常是一串 10~20 位的数字或字母');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  try{
    const d = await post('/api/pub/submit', {
      tail: TAIL, hid: box.dataset.hid, tracking_no: no
    });
    box.classList.add('done');
    box.querySelector('.sent').textContent =
      '已提交 ' + d.tracking_no + (d.carrier ? '（' + d.carrier + '）' : '') + '，等运营核对';
    // 提交完把焦点交给下一单，连着填几单不用来回点
    const next = box.nextElementSibling;
    if(next && next.classList.contains('item')){
      const ni = next.querySelector('input[data-no]');
      if(ni) ni.focus();
    }
  }catch(e){
    btn.disabled = false;
    btn.textContent = '提交';
    flash(box, e.message);
  }
}

function flash(box, msg){
  const old = box.querySelector('.note');
  if(old) old.remove();
  const d = document.createElement('div');
  d.className = 'note err';
  d.style.margin = '0 0 10px';
  d.textContent = msg;
  box.insertBefore(d, box.firstChild);
  setTimeout(function(){ d.remove(); }, 5000);
}

// 填满 4 位自动查：客户不会想到还要再点一下按钮
$('tail').addEventListener('input', function(){
  const v = this.value.replace(/\D/g, '').slice(0, 4);
  this.value = v;
  clearTimeout(TIMER);
  if(v.length === 4){
    TIMER = setTimeout(lookup, 350);
  }else if(v.length === 0){
    $('out').innerHTML = '';
  }
});
$('tail').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ clearTimeout(TIMER); lookup(); }
});
</script>
</body>
</html>
